name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      # GitHub Pages는 정적 파일만 서빙하므로 서버가 필요한 API 라우트는
      # 정적 export 빌드에서 제외한다 (통계 API는 Pages 배포본에서 동작하지 않음).
      - name: API 라우트 제외 (정적 export 대상 아님)
        run: rm -rf app/api

      - name: 정적 사이트 빌드
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
